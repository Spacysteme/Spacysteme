<svg viewBox="0 0 800 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Geometry Dash level animation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

<title>Geometry Dash level</title>

<style>

@keyframes scroll    { to { transform: translateX(-800px); } }  /* niveau + sol : 200px/s */
@keyframes scrollMid { to { transform: translateX(-400px); } }  /* décor proche : 100px/s */
@keyframes scrollFar { to { transform: translateX(-200px); } }  /* décor loin   :  50px/s */

.scroll { animation: scroll    4s linear infinite; }
.mid    { animation: scrollMid 4s linear infinite; }
.far    { animation: scrollFar 4s linear infinite; }

@keyframes jumpY {
  0%      { transform: translateY(0); }
  8.125%  { transform: translateY(0);     animation-timing-function: cubic-bezier(.5,1,.89,1); }
  15%     { transform: translateY(-45px); animation-timing-function: cubic-bezier(.11,0,.5,0); }
  21.875% { transform: translateY(0); }
  23.125% { transform: translateY(0);     animation-timing-function: cubic-bezier(.5,1,.89,1); }
  30%     { transform: translateY(-45px); animation-timing-function: cubic-bezier(.11,0,.5,0); }
  36.875% { transform: translateY(0); }
  39.375% { transform: translateY(0);     animation-timing-function: cubic-bezier(.5,1,.89,1); }
  46.25%  { transform: translateY(-45px); animation-timing-function: cubic-bezier(.11,0,.5,0); }
  51.375% { transform: translateY(-20px); }
  60%     { transform: translateY(-20px); animation-timing-function: cubic-bezier(.11,0,.5,0); }
  64.625% { transform: translateY(0); }
  66.875% { transform: translateY(0);     animation-timing-function: cubic-bezier(.5,1,.89,1); }
  75%     { transform: translateY(-50px); animation-timing-function: cubic-bezier(.11,0,.5,0); }
  83.125% { transform: translateY(0); }
  100%    { transform: translateY(0); }
}

@keyframes spin {
  0%, 8.125%      { transform: rotate(0deg); }
  21.875%, 23.125% { transform: rotate(180deg); }
  36.875%, 39.375% { transform: rotate(360deg); }
  51.375%, 60%     { transform: rotate(450deg); }
  64.625%, 66.875% { transform: rotate(540deg); }
  83.125%, 100%    { transform: rotate(720deg); }
}

.jump { animation: jumpY 4s linear infinite; }
.spin { animation: spin  4s linear infinite; transform-box: fill-box; transform-origin: center; }

.t1 .jump, .t1 .spin { animation-delay: .1s; }
.t2 .jump, .t2 .spin { animation-delay: .2s; }
.t3 .jump, .t3 .spin { animation-delay: .3s; }

@keyframes prog { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.prog { animation: prog 4s linear infinite; transform-box: fill-box; transform-origin: left center; }

@keyframes fall {
  0%   { transform: translate(0, -10px) rotate(0deg);      opacity: 0; }
  10%  { opacity: .7; }
  90%  { opacity: .7; }
  100% { transform: translate(-220px, 135px) rotate(540deg); opacity: 0; }
}
.petal {
  animation-name: fall; animation-timing-function: linear; animation-iteration-count: infinite;
  transform-box: fill-box; transform-origin: center;
}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

<defs>
  <clipPath id="frame"><rect width="800" height="140" rx="12"/></clipPath>

  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0d1117"/>
    <stop offset="1" stop-color="#1b1220"/>
  </linearGradient>

  <pattern id="gt" width="40" height="30" patternUnits="userSpaceOnUse">
    <path d="M0.5 0V30M0 15.5H40" stroke="#e496a7" stroke-opacity=".12" fill="none"/>
  </pattern>

  <!-- Spike -->
  <g id="spike">
    <polygon points="0,20 10,0 20,20" fill="#ff4d6d" fill-opacity=".18" stroke="#ff4d6d" stroke-opacity=".25" stroke-width="5" stroke-linejoin="round"/>
    <polygon points="1.5,19 10,2.5 18.5,19" fill="#170d14" stroke="#ff4d6d" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- Bloc -->
  <g id="block">
    <rect x="1" y="1" width="18" height="18" fill="#1a1119" stroke="#e496a7" stroke-width="2"/>
    <rect x="6" y="6" width="8" height="8" fill="#e496a7" fill-opacity=".25"/>
  </g>

  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="2.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<g clip-path="url(#frame)">

  <!-- Fond -->
  <rect width="800" height="140" fill="url(#sky)"/>

  <!-- Stars -->
  <g class="far" fill="#e496a7">
    <g id="stars">
      <circle cx="20"  cy="22" r="1"   opacity=".5"/>
      <circle cx="75"  cy="48" r="1.2" opacity=".35"/>
      <circle cx="120" cy="14" r=".9"  opacity=".6"/>
      <circle cx="160" cy="40" r="1"   opacity=".4"/>
      <circle cx="185" cy="70" r=".8"  opacity=".3"/>
    </g>
    <use href="#stars" x="200"/><use href="#stars" x="400"/>
    <use href="#stars" x="600"/><use href="#stars" x="800"/>
  </g>

  <!-- Montagnes -->
  <g class="mid">
    <path id="hills" d="M0 110 L60 72 L120 110 L170 88 L230 110 L300 60 L360 110 L400 110 Z" fill="#1d1521" opacity=".9"/>
    <use href="#hills" x="400"/><use href="#hills" x="800"/>
  </g>

  <!-- Sakura -->
  <g fill="#e496a7">
    <ellipse class="petal" cx="140" cy="0" rx="3"   ry="1.8" style="animation-duration:8s;  animation-delay:-1s"/>
    <ellipse class="petal" cx="280" cy="0" rx="2.5" ry="1.5" style="animation-duration:9s;  animation-delay:-4s"/>
    <ellipse class="petal" cx="420" cy="0" rx="3"   ry="1.8" style="animation-duration:7s;  animation-delay:-2s"/>
    <ellipse class="petal" cx="560" cy="0" rx="2.5" ry="1.5" style="animation-duration:10s; animation-delay:-6s"/>
    <ellipse class="petal" cx="700" cy="0" rx="3"   ry="1.8" style="animation-duration:8.5s;animation-delay:-3s"/>
    <ellipse class="petal" cx="790" cy="0" rx="2.5" ry="1.5" style="animation-duration:9.5s;animation-delay:-7s"/>
    <ellipse class="petal" cx="60"  cy="0" rx="2.5" ry="1.5" style="animation-duration:11s; animation-delay:-5s"/>
  </g>

  <!-- Level -->
  <g class="scroll">
    <rect y="110" width="1600" height="30" fill="#10101a"/>
    <rect y="110" width="1600" height="30" fill="url(#gt)"/>
    <rect y="109" width="1600" height="2"  fill="#e496a7"/>

    <g id="obs">
      <!-- spike simple -->
      <use href="#spike" x="220" y="90"/>
      <!-- double spike -->
      <use href="#spike" x="330" y="90"/>
      <use href="#spike" x="350" y="90"/>
      <!-- plateforme -->
      <use href="#block" x="520" y="90"/>
      <use href="#block" x="540" y="90"/>
      <use href="#block" x="560" y="90"/>
      <!-- triple spike -->
      <use href="#spike" x="680" y="90"/>
      <use href="#spike" x="700" y="90"/>
      <use href="#spike" x="720" y="90"/>
    </g>
    <use href="#obs" x="800"/>
  </g>

  <!-- Effect -->
  <g class="t3" transform="translate(40 90)"><g class="jump"><g class="spin"><rect width="20" height="20" rx="2" fill="#e496a7" opacity=".08"/></g></g></g>
  <g class="t2" transform="translate(60 90)"><g class="jump"><g class="spin"><rect width="20" height="20" rx="2" fill="#e496a7" opacity=".16"/></g></g></g>
  <g class="t1" transform="translate(80 90)"><g class="jump"><g class="spin"><rect width="20" height="20" rx="2" fill="#e496a7" opacity=".28"/></g></g></g>

  <!-- Cube -->
  <g transform="translate(100 90)">
    <g class="jump">
      <g class="spin" filter="url(#glow)">
        <rect width="20" height="20" rx="2" fill="#e496a7"/>
        <rect x="2" y="2" width="16" height="16" rx="1" fill="none" stroke="#fff" stroke-opacity=".35"/>
        <rect x="4"  y="6"  width="4"  height="4" fill="#1a0f14"/>
        <rect x="12" y="6"  width="4"  height="4" fill="#1a0f14"/>
        <rect x="5"  y="13" width="10" height="3" fill="#1a0f14"/>
      </g>
    </g>
  </g>

  <!-- Progress -->
  <rect x="250" y="10" width="300" height="6" rx="3" fill="#fff" fill-opacity=".08"/>
  <rect class="prog" x="250" y="10" width="300" height="6" rx="3" fill="#e496a7"/>

</g>

<rect x=".5" y=".5" width="799" height="139" rx="12" fill="none" stroke="#e496a7" stroke-opacity=".25"/>

</svg>

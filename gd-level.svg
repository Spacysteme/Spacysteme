<svg viewBox="0 0 800 120" xmlns="http://www.w3.org/2000/svg">

<style>
@keyframes moveX {
  from { transform: translateX(-120px); }
  to { transform: translateX(920px); }
}

@keyframes jumpY {
17% { transform: translateY(0px); }
20% { transform: translateY(-40px); }
28% { transform: translateY(0px); }
29.7% { transform: translateY(-40px); }
31% { transform: translateY(-40px); }
38% { transform: translateY(0px); }
40% { transform: translateY(-30px); }
45% { transform: translateY(-20px); }
47.4% { transform: translateY(-20px); }
50% { transform: translateY(0px); }
52% { transform: translateY(-40px); }
55.5% { transform: translateY(-18px); }
59% { transform: translateY(-50px); }
60% { transform: translateY(-40px); }
63% { transform: translateY(-40px); }
65% { transform: translateY(-0px); }
74.5% { transform: translateY(-40px); }
75% { transform: translateY(-30px); }
76% { transform: translateY(-20px); }
77% { transform: translateY(-10px); }
78% { transform: translateY(0px); }
}

.cubeMove {
  animation: moveX 6s linear infinite;
}

.cubeJump {
  animation: jumpY 6s linear infinite;
}
</style>

<!-- S -->
<rect x="0" y="100" width="800" height="20" fill="#222"/>

<!-- L -->
<g id="level">

<polygon points="120,100 130,80 140,100" fill="#ff4d6d"/>

<polygon points="200,100 210,80 220,100" fill="#ff4d6d"/>
<polygon points="220,100 230,80 240,100" fill="#ff4d6d"/>

<polygon points="300,100 310,80 320,100" fill="#ff4d6d"/>
<polygon points="320,100 330,80 340,100" fill="#ff4d6d"/>
<rect x="340" y="80" width="20" height="20" fill="#e496a7"/>

<rect x="460" y="80" width="20" height="20" fill="#e496a7"/>

<rect x="500" y="80" width="20" height="20" fill="#e496a7"/>
<rect x="500" y="60" width="20" height="20" fill="#e496a7"/>

<polygon points="620,100 630,80 640,100" fill="#ff4d6d"/>
<polygon points="640,100 650,80 660,100" fill="#ff4d6d"/>
<polygon points="660,100 670,80 680,100" fill="#ff4d6d"/>

</g>

<!-- C -->
<g class="cubeMove">
  <g class="cubeJump">
    <rect x="0" y="80" width="20" height="20" fill="#e496a7"/>
  </g>
</g>

</svg>

<svg viewBox="0 0 800 120" xmlns="http://www.w3.org/2000/svg">

<style>
/* défilement du niveau */
@keyframes scroll {
  from { transform: translateX(0); }
  to   { transform: translateX(-400px); }
}

/* saut vertical (parabole visuelle) */
@keyframes jump {
  0%,20%,40%,60%,80%,100% { transform: translateY(0); }
  10% { transform: translateY(-30px); }  /* spike seul */
  30% { transform: translateY(-35px); }  /* mini spike + spike */
  50% { transform: translateY(-20px); }  /* deux spikes + cube */
  70% { transform: translateY(0); }      /* retombe sur sol */
}

.level { animation: scroll 5s linear infinite; }
.cube { 
  animation: jump 5s linear infinite; 
}
</style>

<!-- Niveau -->
<g class="level">
  <rect x="0" y="100" width="1600" height="20" fill="#222"/>

  <!-- Spike seul -->
  <polygon points="200,100 210,80 220,100" fill="#ff4d6d"/>

  <!-- Mini spike + spike -->
  <polygon points="280,100 290,80 300,100" fill="#ff4d6d"/>
  <polygon points="300,100 310,80 320,100" fill="#ff4d6d"/>

  <!-- Deux spikes + cube -->
  <polygon points="400,100 410,80 420,100" fill="#ff4d6d"/>
  <polygon points="420,100 430,80 440,100" fill="#ff4d6d"/>
  <rect x="440" y="80" width="20" height="20" fill="#e496a7"/>
</g>

<!-- Cube -->
<rect class="cube" x="180" y="80" width="20" height="20" fill="#e496a7"/>

</svg>
